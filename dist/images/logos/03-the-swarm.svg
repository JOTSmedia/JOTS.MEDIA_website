<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="JOTS.MEDIA">
  <!-- CONCEPT 3 — THE SWARM (abstract mark + wordmark) | light bg
       Many jots (agent swarm) settling into one point that feeds the wordmark.
       Site font, weight 300, wide tracking. Apex dot = single accent.
       Dark bg: swap #0A0A0A -> #FAFAFA. Pure mono: apex #00C2D4 -> #0A0A0A. -->
  <rect width="640" height="240" fill="none"/>
  <g fill="#0A0A0A">
    <circle cx="320" cy="58" r="2"/>
    <circle cx="295" cy="62" r="1.7"/>
    <circle cx="345" cy="62" r="1.7"/>
    <circle cx="312" cy="68" r="2"/>
    <circle cx="328" cy="68" r="2"/>
    <circle cx="303" cy="72" r="2.2"/>
    <circle cx="337" cy="72" r="2.2"/>
    <circle cx="311" cy="80" r="2.6"/>
    <circle cx="329" cy="80" r="2.6"/>
    <circle cx="320" cy="84" r="3"/>
  </g>
  <circle cx="320" cy="96" r="5" fill="#00C2D4"/>
  <text x="320" y="166" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="300" font-size="44" letter-spacing="9"
        fill="#0A0A0A">JOTS.MEDIA</text>
</svg>
